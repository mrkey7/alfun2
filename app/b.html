<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Alfiyyah</title>
    <link rel="icon" href="data:,">
    <script src="./path.js" data-page="bait"></script>
  </head>
  <body>
    <div class="menu-utama" id="menuUtama">
      <button id="tombolMenuUtama" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"></path></svg></button>
      <nav id="isiMenuUtama" class="isi-menu-utama" hidden>
        <button id="resetPengaturan">Reset pengaturan</button>
        <label class="opsi-panel">
          <input id="panelAutoHide" type="checkbox"> Autohide panel
        </label>
      </nav>
    </div>

    <header class="kendali" id="panelKendali">
      <label>Font
        <select id="pilihFont">
          <option>Amiri</option>
          <option>Noto Naskh Arabic</option>
          <option>Noto Sans Arabic</option>
          <option>Traditional Arabic</option>
        </select>
      </label>
      <label>Tema
        <select id="pilihTema">
          <option value="klasik">Klasik</option>
          <option value="terang">Terang</option>
          <option value="gelap">Gelap</option>
        </select>
      </label>
      <label class="opsi">
        <input id="tampilHarakat" type="checkbox" checked> Harakat
      </label>
      <label class="opsi">
        <input id="aktifVariasi" type="checkbox"> Variasi
      </label>
      <label class="opsi">
        <input id="teksTebal" type="checkbox"> Tebal
      </label>
      <label>Bait
        <input id="batasBait" type="number" min="0" step="1" value="0">
      </label>
      <label>Ukuran
        <input id="ukuranFont" type="range" min="0" max="100" value="50">
        <output id="nilaiFont">50%</output>
      </label>
    </header>

    <main id="daftarBait">
      <div class="status">Memuat Bait Alfiyyah…</div>
    </main>

  </body>
</html>
